<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
  text-align: center;
  padding: 40px;
}

h2 {
  margin-bottom: 20px;
}

.container {
  background: rgba(255,255,255,0.05);
  padding: 25px;
  border-radius: 12px;
  width: 400px;
  margin: auto;
  
}

input {
  padding: 10px;
  width: 65%;
  border: none;
  border-radius: 6px;
  outline: none;
}

button {
  padding: 10px 14px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s ease;
}

.add-btn {
  background: #00c6ff;
  color: black;
}

.add-btn:hover {
  background: #00a2d3;
}

.delete-btn {
  background: #ff4b5c;
  color: white;
  margin-left: 10px;
}

.delete-btn:hover {
  background: #e63b4a;
}

.back-btn {
  margin-top: 20px;
  background: #4caf50;
  color: white;
}

.back-btn:hover {
  background: #3e8e41;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 20px;
}

li {
  background: rgba(255,255,255,0.1);
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>

</head>
<body>

<div class="container">
  <p style="font-weight: bold; color: white; margin-bottom: 15px; font-size: 16px;">
  ⚠ Reload once to view latest tasks
</p>
  <h2>📋 Your Tasks</h2>

  <input id="taskInput" placeholder="Enter task">
  <button class="add-btn" onclick="addTask()">Add</button>

  <ul id="taskList"></ul>

  <button class="back-btn" onclick="goHome()">⬅ Back to Home</button>
</div>

<script>

async function loadTasks() {
  const res = await fetch("/api/tasks");
  const tasks = await res.json();

  const list = document.getElementById("taskList");
  list.innerHTML = "";

  tasks.forEach(task => {
    const li = document.createElement("li");
    li.id = "task-" + task.id;

    li.innerHTML = `
      <span>${task.title}</span>
      <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
    `;

    list.appendChild(li);
  });
}

async function addTask() {
  const input = document.getElementById("taskInput");

  if (!input.value.trim()) return;

  const res = await fetch("/api/tasks", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: input.value })
  });

  if (res.ok) {
    input.value = "";
    location.reload();
  }
}

async function deleteTask(id) {
  const res = await fetch("/api/tasks/" + id, {
    method: "DELETE"
  });

  if (res.ok) {
    location.reload();
  } else {
    alert("Failed to delete task");
  }
}
function goHome() {
  window.location.href = "index.html";
}

loadTasks();

</script>

</body>
</html>
